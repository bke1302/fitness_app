name: CI

# The deploy job that used to live here pushed a vite build to a gh-pages
# branch it had no permission to write, so it failed on every commit since at
# least September while nobody read the red cross. It was also pointed at the
# wrong thing: the live site is served by GitHub Pages from the root of main,
# which is a separate workflow that has been succeeding all along. Had the
# permission ever been granted, this job would have replaced the working site
# with an untested build. Removed rather than repaired.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests and training audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # The unit tests and the training audits need nothing installed — they
      # run on node alone. Only the rendered pass wants a browser, and it
      # reports itself skipped rather than failing if one is missing.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: npm test
        run: npm test
