<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a12"/>
      <stop offset="100%" style="stop-color:#0a0c10"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(230,57,70,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(230,57,70,0)"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Glow -->
  <ellipse cx="256" cy="256" rx="240" ry="240" fill="url(#glow)"/>
  <!-- Letter P -->
  <text x="256" y="310" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="310" text-anchor="middle" fill="url(#letter)">P</text>
  <!-- FIT label -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-weight="700"
        font-size="90" text-anchor="middle" fill="rgba(255,255,255,0.65)"
        letter-spacing="18">FIT</text>
</svg>
